[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghunt"
version = "0.1.0"
description = "Find available GitHub usernames using LLM suggestions (Ollama)"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["ghunt"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: integration tests (may use mocks)",
    "real_network: tests that hit real GitHub API (skipped by default)",
]
addopts = "-v --tb=short"
